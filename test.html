<style>

*{box-sizing:border-box;margin:0}
body{font:15px/1.35 -apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
main{max-width:480px;margin:0 auto}

header{padding:calc(env(safe-area-inset-top,0px) + 46px) 18px 56px}

.top{display:flex;justify-content:space-between;align-items:center}
.pill{background:#fff;border-radius:30px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}

.coin{display:inline-block;width:28px;height:28px;background:url(ui/coin.webp) center/contain no-repeat;flex:none;vertical-align:middle}

.card{background:#fff;border-radius:20px;margin:-34px 12px 0;padding:16px;box-shadow:0 2px 10px #0001}

.row{display:flex;gap:12px;align-items:center}
.gift{width:48px;height:48px;border-radius:50%;background:var(--y2);display:grid;place-items:center;font-size:24px;flex:none}
h2{font-size:17px}.mut{color:var(--mut);font-size:13px}
.big{font-size:26px;font-weight:800}.big span{font-size:17px;font-weight:600;color:var(--mut)}
.bar{position:relative;height:6px;background:#e6e6ec;border-radius:3px;margin:20px 30px 58px 10px}
.bar>i{position:absolute;left:0;top:0;height:100%;background:var(--y);border-radius:3px}
.bar>b{position:absolute;top:-8px;width:22px;height:22px;transform:translateX(-50%);border-radius:50%;background:#fff;border:3px solid #dcdce3;font-size:12px;text-align:center;line-height:16px}
.bar>b.on{background:var(--y);border-color:var(--y)}
.bar>b em{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-style:normal;font-weight:700;font-size:14px;white-space:nowrap}
.bar>b small{position:absolute;top:46px;left:50%;transform:translateX(-50%);font-weight:400;font-size:11px;color:var(--mut);white-space:nowrap}
.today{background:#fff8dc;border-radius:16px;padding:14px;margin-top:6px}
.today .big{font-size:34px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;background:var(--y);color:var(--ink);font-weight:700;font-size:16px;font-family:inherit;cursor:pointer}
.btn:disabled{background:#d9d9de;color:#888;cursor:default}
.btn.sm{padding:10px;margin-top:8px;font-size:14px;border-radius:12px}
.dark{background:var(--dark);color:#fff}.dark .mut{color:#b9bcc6}
.packs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.pack{background:#fff;color:var(--ink);border-radius:14px;padding:12px 8px;text-align:center}
.pack b{font-size:17px;display:block}.pack .cost{display:flex;gap:4px;justify-content:center;align-items:center;font-weight:800;font-size:18px;margin-top:6px}
.pack .coin{width:22px;height:22px}
.pack{position:relative}.pack .was{font-size:13px;color:var(--mut);margin-top:4px;line-height:1}.pack .was s{text-decoration-thickness:2px;text-decoration-color:var(--bad)}
.pack.onsale{box-shadow:0 0 0 2px var(--bad)}.pack .tg{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:2px 8px;white-space:nowrap}
.sale{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:9px 12px;border-radius:12px;background:#3a1d24;border:1px solid var(--bad);font-size:13px;color:#ffd7dc}.sale .st{background:var(--bad);color:#fff;font-weight:800;font-size:14px;border-radius:8px;padding:2px 10px;letter-spacing:.5px}.sale b{font-variant-numeric:tabular-nums;color:#fff}
.wk{display:grid;grid-template-columns:1fr auto;column-gap:8px;row-gap:8px;align-items:center;padding:10px 0;border-top:1px solid #eee;font-size:14px}.wk:first-of-type{border-top:0}.wk b{display:block}.wk .wv{font-weight:800;white-space:nowrap}.wk .wv.ok{color:var(--ok)}.wk.no,.wk.no .wv{color:var(--mut);font-weight:400}.note{margin-top:10px;line-height:1.45}.warn-t{color:var(--bad)}.wk .wv.bad{color:var(--bad);font-weight:600;font-size:12px}
details{margin:8px 0;background:#f4f4f7;border-radius:12px;padding:10px 12px}summary{font-weight:700;cursor:pointer}details ul{margin:8px 0 0;padding-left:18px}details p{margin:8px 0 0;font-size:14px;line-height:1.45}
.yh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}.yh b{font-size:16px}
.ys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ys b{display:block;font-size:22px;line-height:1.15}.ys span{font-size:12px;color:var(--mut)}
.bar.s{margin:22px 14px 14px 10px}.bar.s>b em,.bar.s>b small{display:none}
.mb{position:relative;grid-column:1/-1;height:6px;background:#e6e6ec;border-radius:3px;margin:2px 4px 0 0}.mb>i{position:absolute;left:0;top:0;height:100%;background:var(--y);border-radius:3px}
.mb>u{position:absolute;top:-3px;width:12px;height:12px;box-sizing:border-box;transform:translateX(-100%);border-radius:50%;background:#fff;border:2px solid #dcdce3}.mb>u.on{background:var(--y);border-color:var(--y)}
.off .mb>i,.off .mb>u.on{background:#bbb;border-color:#bbb}
.req{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid #eee;font-size:14px}
.st{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;background:#eee;height:fit-content;white-space:nowrap}
.st.new{background:#e0ecff;color:#1d4ed8}.st.work{background:#fff1c2;color:#8a6100}.st.done{background:#d9f5e3;color:var(--ok)}.st.rej{background:#fde0e4;color:var(--bad)}
.warn{background:#ffe3e6;border-radius:20px;margin:12px;padding:16px}
.warn .btn{background:var(--bad);color:#fff}
.off .btn:not(.keep),.off .btn:not(.keep):disabled{background:#d9d9de;color:#888;pointer-events:none}
.off .today{background:#eee}.off .gift{filter:grayscale(1)}.off .coin,.off .cn{filter:grayscale(1)}.off .bar>i,.off .bar>b.on{background:#bbb;border-color:#bbb}

.lang button{border:0;background:none;border-radius:16px;padding:6px 11px;font-weight:700;font-size:12px;font-family:inherit;color:var(--ink);cursor:pointer}

.awg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin:14px 0 4px}

.aw .ai{position:relative;width:88%;margin:0 auto 6px}
.aw img{display:block;width:100%;height:auto;border-radius:50%;filter:grayscale(1);opacity:.3}.aw.on img{filter:none;opacity:1}
.awb{position:absolute;right:-6px;top:-4px;background:var(--y);color:var(--ink);font-weight:800;font-size:12px;border-radius:12px;padding:2px 8px;box-shadow:0 1px 4px #0003}
.awb.ok{background:var(--ok);color:#fff}.off .awb{background:#bbb;color:#555}
.card.sea{margin:12px 12px 0;color:#fff;overflow:hidden;position:relative}.card.sea:first-of-type{margin-top:-34px}

.sea h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sea .mut{color:#ffffffb8}.sea .tagc{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;background:#ffffff26;border-radius:10px;padding:2px 9px}

#ld{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,var(--ink),transparent) no-repeat;background-size:40% 100%;animation:ld 1s linear infinite}
#ld.on{opacity:1}
@keyframes ld{from{background-position:-40% 0}to{background-position:140% 0}}
@keyframes sp{to{transform:rotate(360deg)}}
.btn.load{position:relative;color:transparent;pointer-events:none}.btn.load .cn{opacity:0}

.testtag{position:fixed;top:0;left:0;background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:0 0 10px 0;z-index:30;letter-spacing:.5px}

.sp-bar{width:min(260px,72%);height:8px;border-radius:8px;background:#00000014;margin-top:22px;overflow:hidden}

#chip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translate(-50%,-80px);background:var(--ink);color:#fff;font-size:13px;padding:7px 16px;border-radius:20px;z-index:30;transition:transform .25s;pointer-events:none;white-space:nowrap}
#chip.on{transform:translate(-50%,0)}#chip.ok{background:var(--ok)}
</style>

function normPhone(s) {

  if (d.indexOf('0066') === 0) d = d.slice(2);
  if (d.indexOf('660') === 0) d = '66' + d.slice(3);
  else if (d.charAt(0) === '0') d = '66' + d.slice(1);

  return d;
}
/* ---------- Заставка загрузки и индикатор обновления ---------- */
// заставка показывается, только если на экране ещё нет данных (первый запуск, давний перерыв) и ответ задерживается дольше 0,35 с
let spTimers = [], spT = null, syncOk = false;
const spBar = p => { const i = document.querySelector('.sp-bar i'); if (i) i.style.width = p + '%'; };
const spTxt = s => { $('#splash .sp-t').textContent = s; };
function splashShow(d = 350) {
  if (spT || !$('#splash').hidden) return;
  spT = setTimeout(() => {
    const e = $('#splash'); e.hidden = false; e.classList.remove('hide'); spBar(8); spTxt(t('spl1'));
    spTimers = [setTimeout(() => { spBar(40); spTxt(t('spl2')); }, 700), setTimeout(() => spBar(72), 2500),
      setTimeout(() => { spBar(90); spTxt(t('spl3')); }, 5500), setTimeout(() => spTxt(t('splSlow')), 12000)];
  }, d);
}
function splashHide() {
  clearTimeout(spT); spT = null; spTimers.forEach(clearTimeout); spTimers = [];
  const e = $('#splash'); if (e.hidden) return;
  spBar(100); setTimeout(() => { e.classList.add('hide'); setTimeout(() => { e.hidden = true; }, 320); }, 250);
}
let chipT = null;
function chip(kind) {   // 'sync' — идёт обновление, 'ok' — обновлено (гаснет через 2 с), null — убрать
  const e = $('#chip'); clearTimeout(chipT);
  if (!kind) return e.classList.remove('on');
  e.className = 'on' + (kind === 'ok' ? ' ok' : ''); e.textContent = t(kind === 'ok' ? 'synced' : 'syncing');
  if (kind === 'ok') chipT = setTimeout(() => e.classList.remove('on'), 2000);
}
// обновление данных при возвращении в приложение после паузы
async function syncNow() {
  if (!S || !sess || busy) return;
  chip('sync');
  try { setState(await call({ a: 'state' })); render(); chip('ok'); } catch (e) { chip(null); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S && Date.now() - lastSync > 10 * 6e4) syncNow(); });

async function start(raw, city, login) {
  const cold = !S;                                  // на экране нет данных — заставка; есть сохранённые — маленький индикатор «Обновляем данные…»
  cold ? splashShow() : chip('sync');
  syncOk = false;
  try { await startInner(raw, city, login); }
  finally { cold ? splashHide() : chip(syncOk ? 'ok' : null); }
}
async function startInner(raw, city, login) {
  const pin = normPhone(raw);
  if (!/^66\d{8,10}$/.test(pin)) return loginView('pin5', raw);
  sess = { pin, city, login };
  try {
    const j = await call({ a: 'state' });
    if (j.chooseDemo) { demoCtx = { pin, cities: j.cities }; choose = null; idCtx = null; return chooseView(pin, j.cities, true); }
    if (j.choose) { choose = { pin, cities: j.choose }; idCtx = null; return chooseView(pin, j.choose); }
    if (j.needId) { idCtx = { pin, city }; return idView(pin, city); }
    choose = null; idCtx = null; demoCtx = j.demo ? { pin, cities: [city] } : null;
    sess.city = j.city; ls.set('sess', JSON.stringify(sess)); setState(j); syncOk = true; render();
    if (j.demo) demoNotice(); else if (j.welcome) welcomeNotice(j.welcome);
  } catch (e) {
    if (e.message === 'ID не найден') return idView(pin, city, e.message);
    if (S && emsg(e) === 'eNet') return toast(t('eNet'));      // есть сохранённые данные — оставляем их на экране
    ls.del('sess'); ls.del('last'); S = null; idCtx = null; document.body.classList.remove('off'); app.className = ''; loginView(emsg(e), pin);
  }
}
// те же 5 цифр у нескольких водителей одного города — просим логин (ID)
function idView(pin, city, err = '') {
  idCtx = { pin, city };
  app.innerHTML = `<div class="login">${langSw()}<img class="logo" src="maxim-logo.png" alt="maxim"><h1>${t('idTitle')}</h1>
  <p class="mut">${t('idHint')}</p>
  <input id="lid" inputmode="numeric" autocomplete="off" placeholder="ID" style="font-size:24px;letter-spacing:2px">
  <p class="err">${err ? esc(errText(err)) : ''}</p><button class="btn" id="go">${t('go')}</button><button class="out" id="back">${t('back')}</button></div>`;
  const go = () => { const v = $('#lid').value.trim(); if (!v) return; $('#go').classList.add('load'); start(pin, city, v); };
  $('#go').onclick = go; $('#lid').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#lid').focus();
  $('#back').onclick = () => { idCtx = null; loginView('', pin); }; bindLang();
}
function chooseView(pin, cities, isDemo = false) {
  app.innerHTML = `<div class="login">${langSw()}<img class="logo" src="maxim-logo.png" alt="maxim"><h1>${t('chooseCity')}</h1>
  <p class="mut">${isDemo ? t('chooseDemoHint') : t('chooseHint')}</p>
  ${cities.map((c, i) => `<button class="btn" data-i="${i}">${esc(c.replace(/^TH Maxim\s*/i, ''))}</button>`).join('')}
  <button class="out" id="back">${t('back')}</button></div>`;
  app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { b.classList.add('load'); start(pin, cities[b.dataset.i]); });
  $('#back').onclick = () => { choose = null; demoCtx = null; idCtx = null; loginView('', pin); }; bindLang();
}

/* ---------- Приветственные и демо-уведомления ---------- */
function popup(title, text, btn, onOk) {
  const e = document.createElement('div');
  e.className = 'modal';
  e.innerHTML = `<div class="modal-card"><h2>${esc(title)}</h2><p>${esc(text)}</p><button class="btn keep" id="mok">${esc(btn)}</button></div>`;
  document.body.append(e);
  e.querySelector('#mok').onclick = () => { e.remove(); if (onOk) onOk(); };
}
function demoNotice() { popup(t('demoTitle'), t('demoText'), t('demoOk')); }
function welcomeNotice(kind) {
  if (kind === 'legal') popup(t('welTitle'), t('welTextLegal'), t('go2'));
  else popup(t('welTitle'), t('welTextIllegal'), 'OK');
}

/* ---------- Заявки на брендирование ---------- */
function ask(title, text, yes, no, onYes) {
  const e = document.createElement('div');
  e.className = 'modal';
  e.innerHTML = `<div class="modal-card"><h2>${esc(title)}</h2><p>${esc(text)}</p><button class="btn keep" id="myes">${esc(yes)}</button><button class="out" id="mno">${esc(no)}</button></div>`;
  document.body.append(e);
  e.querySelector('#myes').onclick = () => { e.remove(); onYes(); };
  e.querySelector('#mno').onclick = () => e.remove();
}
async function applyBrand(k) {
  if (busy) return; busy = true;
  try { setState(await call({ a: 'applyBrand', t: k })); busy = false; render(); popup(t('adsSentT'), t('adsSent'), 'OK'); }
  catch (e) { busy = false; toast(errText(emsg(e))); refresh(); }
}

/* ---------- Главный экран ---------- */
const barPct = (o, tr) => {
  const n = tr.length, pts = [0, ...tr.map(x => x[0])];
  if (o >= pts[n]) return 100;
  for (let i = 0; i < n; i++) if (o < pts[i + 1]) return (i + (o - pts[i]) / (pts[i + 1] - pts[i])) / n * 100;
  return 100;
};
// slim = без подписей уровней (критерии показаны отдельно)
function bar(o, tr, slim) {
  const n = tr.length;
  return `<div class="bar${slim ? ' s' : ''}"><i style="width:${barPct(o, tr)}%"></i>${tr.map((x, i) =>
    `<b class="${o >= x[0] ? 'on' : ''}" style="left:${(i + 1) / n * 100}%">${o >= x[0] ? '✓' : ''}<em>${x[1]}%</em><small>${x[0]} ${t('orders')}</small></b>`).join('')}</div>`;
}
// маленькая шкала для дня недели
const mini = (o, tr) => `<div class="mb"><i style="width:${barPct(o, tr)}%"></i>${tr.map((x, i) => `<u class="${o >= x[0] ? 'on' : ''}" style="left:${(i + 1) / tr.length * 100}%"></u>`).join('')}</div>`;

function render() {
  const grey = !S.legal || !!S.demo; app.className = grey ? 'off' : ''; document.body.classList.toggle('off', grey);   // !! — иначе undefined превращает toggle() в переключатель
  app.innerHTML = (tab === 'home' ? homeView() : tab === 'awards' ? awardsView() : tab === 'ads' ? adsView() : rulesView()) + `<nav>
  <a data-t="home" class="${tab === 'home' ? 'on' : ''}"><span>🏠</span>${t('nHome')}</a>
  <a data-t="awards" class="${tab === 'awards' ? 'on' : ''}"><span>🏆${S.awardClaim > 0 ? '<i class="dot"></i>' : ''}</span>${t('nAwards')}</a>
  <a data-t="ads" class="${tab === 'ads' ? 'on' : ''}"><span>📢${S.brand && (S.brand.claimDays || []).length ? '<i class="dot"></i>' : ''}</span>${t('nAds')}</a>
  <a data-t="rules" class="${tab === 'rules' ? 'on' : ''}"><span>📋</span>${t('nRules')}</a></nav>`;
  app.querySelectorAll('[data-t]').forEach(a => a.onclick = () => { tab = a.dataset.t; render(); scrollTo(0, 0); });
  bindLang();
  const run = (body, ok, btn) => async () => {
    if (busy) return; busy = true; if (btn) btn.classList.add('load');
    try { setState(await call(body)); toast(t(ok)); } catch (e) { toast(errText(emsg(e))); if (e.message === 'Цена изменилась') { try { setState(await call({ a: 'state' })); } catch (e2) {} } }
    busy = false; render();
  };
  if ($('#claim')) $('#claim').onclick = run({ a: 'claim' }, 'okClaim', $('#claim'));
  if ($('#awclaim')) $('#awclaim').onclick = run({ a: 'claimAwards' }, 'okClaim', $('#awclaim'));
  if ($('#brclaim')) $('#brclaim').onclick = run({ a: 'claimBrand' }, 'okClaim', $('#brclaim'));
  app.querySelectorAll('[data-apply]').forEach(b => b.onclick = e => {
    e.stopPropagation(); const k = b.dataset.apply;
    ask(t('adsAskT'), t('adsAsk', { n: t(k === 'car' ? 'nameCar' : 'nameUni') }), t('adsYes'), t('adsNo'), () => applyBrand(k));
  });
  app.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const p = S.packs[b.dataset.buy], pr = price(p);
    ask(t('exchange'), t('confirmBuy', { c: pr, h: hrs(p[0]) }), t('exchange'), t('adsNo'), run({ a: 'buy', i: +b.dataset.buy, price: pr }, 'okBuy', b));
  });
  if ($('#out')) $('#out').onclick = () => { ls.del('sess'); ls.del('last'); sess = S = null; document.body.classList.remove('off'); app.className = ''; loginView(); };
}

setInterval(() => {
  document.querySelectorAll('[data-cd]').forEach(e => { e.textContent = dur(+e.dataset.cd - nowMs()); });
  if (S && (S.nextClaimAt < nowMs() || (S.cycleEnd || S.nextMonday) < nowMs()) && !busy) refresh();
}, 30000);
// SALE: обратный отсчёт с секундами; когда скидка закончилась — перезапрашиваем цены
let saleOver = false;
setInterval(() => {
  const el = document.querySelector('[data-sale]'); if (!el) { saleOver = false; return; }
  const left = +el.dataset.sale - nowMs();
  if (left > 0) el.textContent = clock(left);
  else if (!saleOver && !busy) { saleOver = true; refresh(); }
}, 1000);
async function refresh() { try { setState(await call({ a: 'state' })); render(); } catch (e) {} }

document.documentElement.lang = L; document.title = t('title') + ' — Maxim';
const saved = ls.get('sess');
if (saved) {
  try {
    const s = JSON.parse(saved), c = JSON.parse(ls.get('last') || 'null');
    if (!/^66\d{8,10}$/.test(String(s.pin))) throw new Error('old session');   // раньше хранились 5 цифр
    sess = s;
    if (c && c.p === s.pin && c.c === s.city && Date.now() - c.t < 864e5) { S = c.s; render(); } else splashShow(0);   // данных на экране нет — сразу заставка
    start(s.pin, s.city, s.login);
  } catch (e) { ls.del('sess'); ls.del('last'); loginView(); }
} else loginView();
</script>
</body>
</html>
