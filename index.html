<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ваши награды — Maxim</title>
<style>
:root{--y:#ffd91a;--y2:#fff3b8;--ink:#1c1c21;--mut:#6b7280;--bg:#f3f3f1;--dark:#23262d;--ok:#1f9d55;--bad:#e5384f}
*{box-sizing:border-box;margin:0}
body{font:15px/1.35 -apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
main{max-width:480px;margin:0 auto}
.bg{position:fixed;inset:0;z-index:-1;background:#cfe6ff url(background.jpg) center 60%/cover no-repeat}
body.off .bg{filter:grayscale(1)}
header{padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 56px}
header h1{font-size:26px;margin:6px 0 4px}header p{font-size:14px}
.logo{font-weight:800;font-size:26px;letter-spacing:-1px}
.top{display:flex;justify-content:space-between;align-items:center}
.pill{background:#fff;border-radius:30px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}
.pill small{display:block;font-size:11px;font-weight:400;color:var(--mut);margin-top:-3px}
.coin{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:radial-gradient(#ffe27a,#f0a800);border:2px solid #fff3b8;color:#fff;font-weight:800;font-size:15px;flex:none}
.card{background:#fff;border-radius:20px;margin:-34px 12px 0;padding:16px;box-shadow:0 2px 10px #0001}
.card+.card{margin-top:12px}
.row{display:flex;gap:12px;align-items:center}
.gift{width:48px;height:48px;border-radius:50%;background:var(--y2);display:grid;place-items:center;font-size:24px;flex:none}
h2{font-size:17px}.mut{color:var(--mut);font-size:13px}
.big{font-size:26px;font-weight:800}.big span{font-size:17px;font-weight:600;color:var(--mut)}
.bar{position:relative;height:6px;background:#e6e6ec;border-radius:3px;margin:20px 30px 58px 10px}
.bar>i{position:absolute;left:0;top:0;height:100%;background:var(--y);border-radius:3px}
.bar>b{position:absolute;top:-8px;width:22px;height:22px;transform:translateX(-50%);border-radius:50%;background:#fff;border:3px solid #dcdce3;font-size:12px;text-align:center;line-height:16px}
.bar>b.on{background:var(--y);border-color:var(--y)}
.bar>b em{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-style:normal;font-weight:700;font-size:14px;white-space:nowrap}
.bar>b small{position:absolute;top:46px;left:50%;transform:translateX(-50%);font-weight:400;font-size:11px;color:var(--mut);white-space:nowrap}
.today{background:#fff8dc;border-radius:16px;padding:14px;margin-top:6px}
.today .big{font-size:34px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;background:var(--y);color:var(--ink);font-weight:700;font-size:16px;font-family:inherit;cursor:pointer}
.btn:disabled{background:#d9d9de;color:#888;cursor:default}
.btn.sm{padding:10px;margin-top:8px;font-size:14px;border-radius:12px}
.dark{background:var(--dark);color:#fff}.dark .mut{color:#b9bcc6}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pack{background:#fff;color:var(--ink);border-radius:14px;padding:12px 8px;text-align:center}
.pack b{font-size:17px;display:block}.pack .cost{display:flex;gap:4px;justify-content:center;align-items:center;font-weight:800;font-size:18px;margin-top:6px}
.pack .coin{width:22px;height:22px;font-size:11px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;text-align:center;font-size:12px}
.col{display:flex;flex-direction:column;align-items:center;gap:3px}
.col .t{height:56px;width:70%;background:#eee;border-radius:6px;position:relative;overflow:hidden}
.col .t i{position:absolute;bottom:0;width:100%;background:var(--y)}
.col.now .t{outline:2px solid var(--ink)}
.tot{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid #eee}
.tot b{display:block;font-size:17px}
.req{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid #eee;font-size:14px}
.st{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;background:#eee;height:fit-content;white-space:nowrap}
.st.Новая{background:#e0ecff;color:#1d4ed8}.st.В\ работе{background:#fff1c2;color:#8a6100}.st.Выполнена{background:#d9f5e3;color:var(--ok)}.st.Отклонена{background:#fde0e4;color:var(--bad)}
.warn{background:#ffe3e6;border-radius:20px;margin:12px;padding:16px}
.warn .btn{background:var(--bad);color:#fff}
.off .btn:not(.keep),.off .btn:not(.keep):disabled{background:#d9d9de;color:#888;pointer-events:none}
.off .today{background:#eee}.off .col .t i{background:#bbb}.off .gift{filter:grayscale(1)}.off .coin{filter:grayscale(1)}.off .bar>i,.off .bar>b.on{background:#bbb;border-color:#bbb}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 8px)}
nav a{flex:1;text-align:center;font-size:12px;color:#444;text-decoration:none;cursor:pointer}
nav a span{display:block;font-size:22px}nav a.on{color:#d49a00;font-weight:700}
.login{max-width:360px;margin:12vh 16px 0;padding:24px;text-align:center;background:#ffffffd9;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:24px;box-shadow:0 4px 24px #0002}
@media(min-width:392px){.login{margin:12vh auto 0}}
.login h1{margin:14px 0 6px}
.login input{width:100%;font-size:32px;letter-spacing:10px;text-align:center;padding:12px;border:2px solid #ddd;border-radius:14px;margin:18px 0 0}
.login input:focus{outline:3px solid var(--y);border-color:var(--y)}
.err{color:var(--bad);margin-top:10px;min-height:20px}
.rules h2{margin:14px 0 6px}.rules li{margin:4px 0 4px 18px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:9}
.out{background:none;border:0;font-size:12px;color:var(--mut);margin:14px auto;display:block;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="bg"></div>
<main id="app"></main>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwypLTvqQLXNeJJs1cRJ_16usJjJhI4I4iJnejrVxpFa1IfCm-DTMVeX5QvRgqMa7WF6A/exec';           // URL развёрнутого Apps Script
const PDL_URL = '#', TAXSEE_URL = '#';              // ссылки для кнопок «Загрузить PDL» и «Назад в Taxsee Driver»

let sess = null, S = null, tab = 'home', busy = false;
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hrs = n => n + ' ' + ((n % 10 == 1 && n % 100 != 11) ? 'час' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'часа' : 'часов');
const dur = ms => { const m = Math.floor(Math.max(0, ms) / 6e4), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60); return (d ? d + ' д ' : '') + h + ' ч ' + m % 60 + ' мин'; };
const money = n => '฿' + Math.round(n).toLocaleString('ru');
const ls = { get: k => { try { return localStorage.getItem(k) } catch (e) { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} }, del: k => { try { localStorage.removeItem(k) } catch (e) {} } };

async function call(body) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ ...sess, ...body }) });   // text/plain → без preflight
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.append(e); setTimeout(() => e.remove(), 2800); }

function loginView(msg = '') {
  app.innerHTML = `<div class="login"><div class="logo">maxim</div><h1>Ваши награды</h1>
  <p class="mut">Введите последние 5 цифр номера телефона</p>
  <input id="pin" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="•••••">
  <p class="err" id="err">${esc(msg)}</p><button class="btn" id="go">Войти</button></div>`;
  const go = () => start($('#pin').value.trim());
  $('#go').onclick = go; $('#pin').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#pin').focus();
}
async function start(pin, city) {
  if (!/^\d{5}$/.test(pin)) return loginView('Введите ровно 5 цифр');
  sess = { pin, city };
  try {
    const j = await call({ a: 'state' });
    if (j.choose) return chooseView(pin, j.choose);
    sess.city = j.city; ls.set('sess', JSON.stringify(sess)); S = j; render();
  } catch (e) { ls.del('sess'); loginView(e.message); }
}
function chooseView(pin, cities) {
  app.innerHTML = `<div class="login"><div class="logo">maxim</div><h1>Выберите город</h1>
  <p class="mut">Эти цифры есть у нескольких водителей</p>
  ${cities.map((c, i) => `<button class="btn" data-i="${i}">${esc(c.replace(/^TH Maxim\s*/i, ''))}</button>`).join('')}
  <button class="out" id="back">Назад</button></div>`;
  app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => start(pin, cities[b.dataset.i]));
  $('#back').onclick = () => loginView();
}

function bar(o, t) {
  const n = t.length, pts = [0, ...t.map(x => x[0])]; let f = 100;
  if (o < pts[n]) for (let i = 0; i < n; i++) if (o < pts[i + 1]) { f = (i + (o - pts[i]) / (pts[i + 1] - pts[i])) / n * 100; break; }
  return `<div class="bar"><i style="width:${f}%"></i>${t.map((x, i) =>
    `<b class="${o >= x[0] ? 'on' : ''}" style="left:${(i + 1) / n * 100}%">${o >= x[0] ? '✓' : ''}<em>${x[1]}%</em><small>${x[0]} заказов</small></b>`).join('')}</div>`;
}

function homeView() {
  const { today: td, tiers, packs, week, legal } = S, max = tiers.length ? tiers[tiers.length - 1][0] : 30;
  const next = tiers.find(t => t[0] > td.o), claim = S.claimDays.reduce((s, x) => s + x.coins, 0);
  const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'], today = new Date(Date.now() + 7 * 36e5).toISOString().slice(0, 10);
  const cols = days.map((nm, i) => {
    const d = new Date(Date.parse(S.weekStart) + i * 864e5).toISOString().slice(0, 10), x = week.find(w => w.d === d);
    return `<div class="col ${d === today ? 'now' : ''}"><div class="t"><i style="height:${x ? Math.min(100, x.o / max * 100) : 0}%"></i></div><b>${x ? x.o : '–'}</b><span class="mut">${nm}</span><span>${x ? (x.done ? '✓' : x.coins ? '🪙' : '') : ''}</span></div>`;
  }).join('');
  const wo = week.reduce((s, x) => s + x.o, 0), ws = week.reduce((s, x) => s + x.s, 0), wc = week.reduce((s, x) => s + x.coins, 0);
  return `
  <header><div class="top"><span class="logo">maxim</span><div class="pill"><span class="coin">฿</span><div>${S.balance}<small>Ваши монеты</small></div></div></div>
  <h1>Ваши награды</h1><p>Больше заказов — больше заработок — больше экономия</p></header>
  <section class="card"><div class="row"><div class="gift">🎁</div><div><h2>Бонус за заказы</h2><span class="mut">Сегодня выполнено · ${esc(S.cityName)}</span><div class="big">${td.o} <span>на сумму ${money(td.s)}</span></div></div></div>
  ${tiers.length ? bar(td.o, tiers) : ''}
  <div class="today"><span class="mut">Бонус за сегодня</span><div class="big">${td.pct}% <span>${money(td.coins)}</span></div>
  <p class="mut">${next ? `Ещё ${next[0] - td.o} зак. до бонуса ${next[1]}%` : 'Максимальный уровень бонуса'}</p></div>
  <button class="btn" id="claim" ${claim > 0 ? '' : 'disabled'}>🪙 Получить монеты${claim > 0 ? ' +' + claim : ''}</button>
  <p class="mut" style="margin-top:10px">⏱ Следующие монеты через <b data-cd="${S.nextClaimAt}">${dur(S.nextClaimAt - Date.now())}</b> (с 9:00 по Бангкоку)</p></section>

  <section class="card"><h2>За неделю</h2><div class="week">${cols}</div>
  <div class="tot"><div><b>${wo}</b><span class="mut">заказов</span></div><div><b>${money(ws)}</b><span class="mut">сумма</span></div><div><b>${wc}</b><span class="mut">монет</span></div></div></section>

  <section class="card dark"><div class="row" style="justify-content:space-between"><div><h2>Ваши монеты</h2><span class="mut">Обменивайте на пакеты бесплатной комиссии</span></div><div class="pill" style="background:none;color:var(--y);font-size:26px">${S.balance}</div></div>
  <div class="packs">${packs.map((p, i) => `<div class="pack"><b>${hrs(p[0])}</b><div class="cost"><span class="coin">฿</span>${p[1]}</div>
  <button class="btn sm" data-buy="${i}" ${S.balance >= p[1] ? '' : 'disabled'}>Обменять</button></div>`).join('')}</div></section>

  <section class="card"><h2>Вывод на баланс Taxsee Driver</h2>
  <p class="mut" style="margin-top:4px">Неиспользованные монеты переводятся на баланс Taxsee Driver каждый понедельник. До перевода: <b data-cd="${S.nextMonday}">${dur(S.nextMonday - Date.now())}</b></p>
  <button class="btn sm" id="wd" ${S.balance >= 1 ? '' : 'disabled'}>Запросить вывод сейчас · ${S.balance} ฿</button></section>

  ${S.requests.length ? `<section class="card"><h2>Мои заявки</h2>${S.requests.map(r => `<div class="req"><div><b>${esc(r.title)}</b><div class="mut">${esc(r.t)}</div></div><div style="text-align:right"><span class="st ${esc(r.st)}">${esc(r.st)}</span><div class="mut">−${r.cost}</div></div></div>`).join('')}</section>` : ''}

  ${legal ? '' : `<section class="warn"><h2>❗ Хотите участвовать в программе?</h2><p style="margin:6px 0 0">Без Public Driver License (PDL) вы пока не можете получать бонусы и монеты.</p><a href="${PDL_URL}"><button class="btn keep sm">Загрузить Public Driver License</button></a></section>`}
  <button class="out" id="out">Выйти</button>`;
}

function rulesView() {
  return `<header><div class="top"><span class="logo">maxim</span></div><h1>Правила акции</h1></header>
  <section class="card rules"><h2>Бонус за заказы</h2><p>Чем больше заказов за календарный день (по времени Бангкока), тем выше процент от их общей стоимости. Процент определяется достигнутым уровнем и применяется ко всей сумме дня.</p>
  <ul>${S.tiers.map(t => `<li>от ${t[0]} заказов — ${t[1]}%</li>`).join('')}</ul>
  <h2>Монеты</h2><ul><li>1 монета = 1 бат.</li><li>Монеты за вчерашний день можно получить после 9:00 по Бангкоку, один раз за каждый день.</li><li>Неполученные монеты можно забрать в течение 7 дней.</li></ul>
  <h2>На что потратить</h2><ul>${S.packs.map(p => `<li>пакет бесплатной комиссии на ${hrs(p[0])} — ${p[1]} монет</li>`).join('')}<li>перевод на баланс Taxsee Driver (автоматически по понедельникам или по запросу).</li></ul>
  <p style="margin-top:8px">Монеты списываются при заявке. Оператор обработает её вручную; статус виден в разделе «Мои заявки». Если заявка отклонена, монеты вернутся.</p>
  <h2>Условия участия</h2><ul><li>Нужна действующая Public Driver License (PDL).</li></ul></section>`;
}

function render() {
  app.className = S.legal ? '' : 'off'; document.body.classList.toggle('off', !S.legal);
  app.innerHTML = (tab === 'home' ? homeView() : rulesView()) + `<nav>
  <a data-t="home" class="${tab === 'home' ? 'on' : ''}"><span>🏠</span>Главная</a>
  <a data-t="rules" class="${tab === 'rules' ? 'on' : ''}"><span>📋</span>Правила акции</a>
  <a href="${TAXSEE_URL}"><span>↩️</span>Назад в Taxsee Driver</a></nav>`;
  app.querySelectorAll('[data-t]').forEach(a => a.onclick = () => { tab = a.dataset.t; render(); scrollTo(0, 0); });
  const run = (body, ok) => async () => {
    if (busy) return; busy = true;
    try { S = await call(body); toast(ok); } catch (e) { toast(e.message); }
    busy = false; render();
  };
  if ($('#claim')) $('#claim').onclick = run({ a: 'claim' }, 'Монеты получены');
  if ($('#wd')) $('#wd').onclick = () => confirm(`Запросить вывод ${S.balance} ฿ на баланс Taxsee Driver?`) && run({ a: 'withdraw' }, 'Заявка на вывод создана')();
  app.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const p = S.packs[b.dataset.buy];
    if (confirm(`Обменять ${p[1]} монет на пакет ${hrs(p[0])}?`)) run({ a: 'buy', i: +b.dataset.buy }, 'Заявка отправлена в поддержку')();
  });
  if ($('#out')) $('#out').onclick = () => { ls.del('sess'); sess = S = null; document.body.classList.remove('off'); loginView(); };
}

setInterval(() => {
  document.querySelectorAll('[data-cd]').forEach(e => { const l = +e.dataset.cd - Date.now(); e.textContent = dur(l); });
  if (S && (S.nextClaimAt < Date.now() || S.nextMonday < Date.now()) && !busy) refresh();
}, 30000);
async function refresh() { try { S = await call({ a: 'state' }); render(); } catch (e) {} }

const saved = ls.get('sess');
if (saved) { try { const s = JSON.parse(saved); start(s.pin, s.city); } catch (e) { loginView(); } } else loginView();
</script>
</body>
</html>
