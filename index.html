let ambiguousDigitsBuffer = "";

function showAmbiguousModal(digitsEntered) {
  const modal = document.getElementById("ambiguousModal");
  const digitsSpan = document.getElementById("ambiguousDigits");
  const input = document.getElementById("ambiguousInput");
  const title = document.getElementById("ambiguousTitle");
  const subtitle = document.getElementById("ambiguousSubtitle");
  const tapArea = document.getElementById("ambiguousTapArea");
  const cancelBtn = document.querySelector(".ambiguousCancelBtn");
  
  ambiguousDigitsBuffer = String(digitsEntered);
  digitsSpan.innerText = ambiguousDigitsBuffer;
  input.value = "";
  
  // Устанавливаем локализованные тексты
  title.innerText = t("ambiguous_title");
  
  const remaining = 11 - ambiguousDigitsBuffer.length;
  if (remaining > 1) {
    subtitle.innerText = t("ambiguous_subtitle_next");
  } else {
    subtitle.innerText = t("ambiguous_subtitle_last");
  }
  
  tapArea.innerText = t("ambiguous_tap_hint");
  cancelBtn.innerText = "↪️ " + t("ambiguous_cancel");
  
  // Показываем модалку
  modal.style.display = "flex";
  
  // Устанавливаем обработчик ввода
  input.oninput = function(e) {
    const digit = this.value.replace(/[^0-9]/g, '').slice(-1);
    if (digit.length === 1) {
      // Новая цифра добавляется СЛЕВА
      const newDigits = digit + ambiguousDigitsBuffer;
      this.value = ""; // Очищаем input
      requestDriverByDigits(newDigits);
    }
  };
  
  // НЕ делаем автофокус
}

function focusAmbiguousInput() {
  const input = document.getElementById("ambiguousInput");
  if (input) {
    input.focus();
  }
}

function requestDriverByDigits(digits) {
  const digitsSpan = document.getElementById("ambiguousDigits");
  const tapArea = document.getElementById("ambiguousTapArea");
  
  // Обновляем отображение
  digitsSpan.innerText = digits;
  ambiguousDigitsBuffer = digits;
  
  tapArea.innerText = "⏳ " + t("ambiguous_checking");
  tapArea.style.pointerEvents = "none";
  tapArea.style.opacity = "0.6";
  
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.login && !res.isAmbiguous) {
        document.getElementById("ambiguousModal").style.display = "none";
        completeSuccessfulLogin(res, digits);
      } else if (res.isAmbiguous) {
        tapArea.innerText = t("ambiguous_tap_hint");
        tapArea.style.pointerEvents = "auto";
        tapArea.style.opacity = "1";
        setTimeout(() => focusAmbiguousInput(), 100);
      } else if (res.error === "still_ambiguous") {
        showMessage(t("ambiguous_error_still"), true, 5000);
        cancelAmbiguous();
      } else {
        showMessage(t("driver_not_found"), true, 3000);
        cancelAmbiguous();
      }
    })
    .withFailureHandler(function(err) {
      showMessage(t("connection_error"), true, 3000);
      tapArea.innerText = t("ambiguous_tap_hint");
      tapArea.style.pointerEvents = "auto";
      tapArea.style.opacity = "1";
      console.error("requestDriverByDigits error:", err);
    })
    .getDriverByPhone(digits, userAgent);
}

function completeSuccessfulLogin(res, lastDigits) {
  const last6 = lastDigits.length >= 6 ? lastDigits.slice(-6) : lastDigits;
  
  currentLogin = res.login;
  window.currentLogin = res.login;

  saveLogin(res.login, last6);
  
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("loginName").innerText = res.login;

    .withFailureHandler(function(err) { log("Login logging failed: " + err); })
    .logLoginAttempt(lastDigits, true, res.login, res.phone || "", res.city || "", userAgent);
  
  google.script.run
    .withSuccessHandler(function(data) {
      hideAppLoader();

function flyCoinsToElement(targetElement) {
  if(!targetElement) return;
  
  const rect = targetElement.getBoundingClientRect();
  const tx = rect.left + rect.width / 2;
  const ty = rect.top + rect.height / 2;
  const startX = window.innerWidth / 2;
  const startY = window.innerHeight / 2;
  
  for (let i = 0; i < 15; i++) {
    setTimeout(function() {
      const coin = document.createElement("div");
      coin.innerHTML = getCoinIcon("80px");
      coin.style.position = "fixed";
      coin.style.left = startX + (Math.random() - 0.5) * 60 + "px";
      coin.style.top = startY + (Math.random() - 0.5) * 60 + "px";
      coin.style.fontSize = "40px";
      coin.style.zIndex = "99999";
      coin.style.pointerEvents = "none";
      coin.style.color = "#FFD700";
      coin.style.textShadow = "0 0 5px rgba(0,0,0,0.5)";
      coin.style.fontWeight = "bold";
      coin.style.transition = "all 0.6s ease-out";
      document.body.appendChild(coin);
      
      // Анимация
      setTimeout(function() {
        coin.style.transform = `translate(${tx - startX + (Math.random() - 0.5) * 30}px, ${ty - startY - 30}px) scale(0.3)`;
        coin.style.opacity = "0";
      }, 10);
      
      setTimeout(function() {
        coin.remove();
      }, 700);
    }, i * 40);
  }
}

function setupHistoryTabs() {
  const tabs = document.querySelectorAll('.historyTab');
  const shiftsContent = document.getElementById('shiftsTabContent');

  tabs.forEach(tab => {
    tab.addEventListener('click', function() {
      const tabName = this.getAttribute('data-tab');
      
      // Убираем активный класс у всех вкладок
      tabs.forEach(t => t.classList.remove('active'));
      // Добавляем активный класс текущей вкладке
      this.classList.add('active');
      
      // Показываем нужный контент
      if(tabName === 'shifts') {
        shiftsContent.style.display = 'block';
        transactionsContent.style.display = 'none';
      } else if(tabName === 'transactions') {
        shiftsContent.style.display = 'none';
        transactionsContent.style.display = 'block';
      }
      
      currentHistoryTab = tabName;
    });
  });
}

function formatCurrency(amount) {
  if (!amount && amount !== 0) return "0";
  return Number(amount).toLocaleString("ru-RU");
}

function formatCurrencyWithSymbol(amount, currency) {
  if (!currency) return formatCurrency(amount);
  const num = formatCurrency(amount);
  if (currency.position === "before") return currency.symbol + num;
  return num + " " + currency.symbol;
}

        illegalBtn.style.fontSize = "24px";
        illegalBtn.style.padding = "20px";
        illegalBtn.onclick = function() {
          const url = t("cashback_license_url");
          if (url && url !== "cashback_license_url") {
            window.open(url, "_blank");
          }
        };
      }
    } else {
      illegalBlock.style.display = "none";
    }
  }

  // ========== ИСТОРИЯ (УВЕЛИЧЕННАЯ) ==========
  const historyDiv = document.getElementById("cashbackHistoryList");

  if (!data.history || data.history.length === 0) {
    historyDiv.innerHTML =
      '<div style="text-align:center; color:#9ca3af; padding:40px; font-size:24px;">' +
      t("cashback_no_history") + '</div>';
    return;
  }

  let html = "";
  data.history.forEach(function(row) {
    const percentColor =
      row.percent >= 20 ? "#16a34a" :
      row.percent >= 15 ? "#0284c7" :
      row.percent >= 10 ? "#d97706" : "#9ca3af";

    html +=
      '<div class="cashbackHistoryRow" style="padding:20px 0; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">' +
        '<div>' +
          '<div style="font-size:28px; font-weight:900; color:#000000;">' + row.date + '</div>' +
          '<div style="font-size:20px; color:#000000; margin-top:6px;">' +
            row.orders + " " + t("cashback_orders").toLowerCase() +
            " · " + formatCurrencyWithSymbol(row.amount, currency) +
          '</div>' +
        '</div>' +
        '<div style="text-align:right;">' +
          '<div style="font-size:32px; font-weight:900; color:' + percentColor + ';">' +
            row.percent + "%" +
          '</div>' +
          '<div style="font-size:24px; color:#16a34a; font-weight:900; margin-top:4px;">' +
            "+" + formatCurrencyWithSymbol(row.cashback, currency) +
          '</div>' +
        '</div>' +
      '</div>';
  });

  historyDiv.innerHTML = html;
}

function updateCashbackBadge(percent) {
  const badge = document.getElementById("cashbackBadge");
  if (!badge) return;

  let bg;
  if (percent >= 20)     bg = "linear-gradient(135deg,#22c55e,#16a34a)";
  else if (percent >= 15) bg = "linear-gradient(135deg,#0ea5e9,#0284c7)";
  else if (percent >= 10) bg = "linear-gradient(135deg,#f59e0b,#d97706)";
  else                    bg = "linear-gradient(135deg,#6b7280,#4b5563)";

  badge.style.background = bg;
}

function initCashbackBadge(data) {
  const badge = document.getElementById("cashbackBadge");
  if (!badge) return;

  if (!data || !data.cashbackEnabled) {
    badge.style.display = "none";
    return;
  }

  badge.style.display = "block";

  const labelEl = document.getElementById("cashbackBadgeLabelEl");
  if (labelEl) labelEl.innerText = t("cashback_badge_label");

  // Сразу показываем максимальный процент из getDriverAppData
  const maxEl = document.getElementById("cashbackBadgeMaxPercent");
  if (maxEl) {
    if (data.cashbackMaxPercent) {
      maxEl.innerText = data.cashbackMaxPercent + "%";
    } else {
      maxEl.innerText = "20%"; // fallback
    }
  }
}

function detectCurrentLanguage() {
  if (typeof localization !== 'undefined' && localization["login_button"]) {
    const text = localization["login_button"];
    if (/[а-яА-Я]/.test(text)) return "ru";
    if (/[ก-๙]/.test(text)) return "th";
    if (/[ă-žâêô]/.test(text)) return "vn";
  }
  return "en";
}

function showBonusNotification(message, reasonName, localizedReasons) {
  const lang = detectCurrentLanguage();
  
  let localizedReason = reasonName;
  if (localizedReasons && localizedReasons[lang]) {
    localizedReason = localizedReasons[lang];
  }
  
  const coinIcon = typeof getCoinIcon === 'function' ? getCoinIcon("80px") : "🪙";
  const finalMessage = "+" + message + " " + coinIcon + " " + localizedReason;
  
  const okButtonText = (typeof t === 'function') ? t("bonus_ok_button") : "Отлично!";
  
  const isMobile = window.innerWidth <= 600;
  
  const modal = document.createElement("div");
  modal.style.cssText = "position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 9999999; display: flex; align-items: center; justify-content: center; padding: 20px;";
  
  if (isMobile) {
    modal.innerHTML = '<div style="background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); border-radius: 20px; padding: 30px 20px; text-align: center; max-width: 95%; width: 100%; box-shadow: 0 10px 40px rgba(255, 215, 0, 0.6); border: 2px solid #FFF;">' +
                      '<div style="font-size: 60px; margin-bottom: 20px;">🎁</div>' +
                      '<div style="font-size: 20px; font-weight: bold; color: #000; margin-bottom: 25px; line-height: 1.4; word-wrap: break-word;">' + finalMessage + '</div>' +
                      '<button onclick="this.parentElement.parentElement.remove()" style="background: #000; color: #FFD700; border: none; border-radius: 30px; padding: 14px 40px; font-size: 18px; font-weight: bold; cursor: pointer; font-family: Arial, sans-serif; width: 100%; max-width: 280px;">' + okButtonText + '</button>' +
                      '</div>';
  } else {
    modal.innerHTML = '<div style="background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); border-radius: 40px; padding: 80px; text-align: center; max-width: 90%; width: 800px; box-shadow: 0 20px 80px rgba(255, 215, 0, 0.6); border: 4px solid #FFF;">' +
                      '<div style="font-size: 120px; margin-bottom: 40px;">🎁</div>' +
                      '<div style="font-size: 44px; font-weight: bold; color: #000; margin-bottom: 60px; line-height: 1.4;">' + finalMessage + '</div>' +
                      '<button onclick="this.parentElement.parentElement.remove()" style="background: #000; color: #FFD700; border: none; border-radius: 60px; padding: 30px 80px; font-size: 36px; font-weight: bold; cursor: pointer; font-family: Arial, sans-serif;">' + okButtonText + '</button>' +
                      '</div>';
  }
  
  document.body.appendChild(modal);
}
</script>
