<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://script.google.com">
<link rel="preload" as="image" href="background.jpg">
<link rel="preload" as="image" href="maxim-logo.png">
<title>Ваши награды — Maxim</title>
<style>
:root{--y:#ffd91a;--y2:#fff3b8;--ink:#1c1c21;--mut:#6b7280;--bg:#f3f3f1;--dark:#23262d;--ok:#1f9d55;--bad:#e5384f}
*{box-sizing:border-box;margin:0}
body{font:15px/1.35 -apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
main{max-width:480px;margin:0 auto}
.bg{position:fixed;inset:0;z-index:-1;background:#cfe6ff url(background.jpg) center 60%/cover no-repeat}
body.off .bg{filter:grayscale(1)}
header{padding:calc(env(safe-area-inset-top,0px) + 46px) 18px 56px}
header h1{font-size:26px;margin:6px 0 4px}header p{font-size:14px}
img.logo{height:26px;width:auto;display:block}
.login img.logo{height:34px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center}
.pill{background:#fff;border-radius:30px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}
.pill small{display:block;font-size:11px;font-weight:400;color:var(--mut);margin-top:-3px}
.coin{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:radial-gradient(#ffe27a,#f0a800);border:2px solid #fff3b8;color:#fff;font-weight:800;font-size:15px;flex:none}
.card{background:#fff;border-radius:20px;margin:-34px 12px 0;padding:16px;box-shadow:0 2px 10px #0001}
.card+.card{margin-top:12px}
.row{display:flex;gap:12px;align-items:center}
.gift{width:48px;height:48px;border-radius:50%;background:var(--y2);display:grid;place-items:center;font-size:24px;flex:none}
h2{font-size:17px}.mut{color:var(--mut);font-size:13px}
.big{font-size:26px;font-weight:800}.big span{font-size:17px;font-weight:600;color:var(--mut)}
.bar{position:relative;height:6px;background:#e6e6ec;border-radius:3px;margin:20px 30px 58px 10px}
.bar>i{position:absolute;left:0;top:0;height:100%;background:var(--y);border-radius:3px}
.bar>b{position:absolute;top:-8px;width:22px;height:22px;transform:translateX(-50%);border-radius:50%;background:#fff;border:3px solid #dcdce3;font-size:12px;text-align:center;line-height:16px}
.bar>b.on{background:var(--y);border-color:var(--y)}
.bar>b em{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-style:normal;font-weight:700;font-size:14px;white-space:nowrap}
.bar>b small{position:absolute;top:46px;left:50%;transform:translateX(-50%);font-weight:400;font-size:11px;color:var(--mut);white-space:nowrap}
.today{background:#fff8dc;border-radius:16px;padding:14px;margin-top:6px}
.today .big{font-size:34px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;background:var(--y);color:var(--ink);font-weight:700;font-size:16px;font-family:inherit;cursor:pointer}
.btn:disabled{background:#d9d9de;color:#888;cursor:default}
.btn.sm{padding:10px;margin-top:8px;font-size:14px;border-radius:12px}
.dark{background:var(--dark);color:#fff}.dark .mut{color:#b9bcc6}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pack{background:#fff;color:var(--ink);border-radius:14px;padding:12px 8px;text-align:center}
.pack b{font-size:17px;display:block}.pack .cost{display:flex;gap:4px;justify-content:center;align-items:center;font-weight:800;font-size:18px;margin-top:6px}
.pack .coin{width:22px;height:22px;font-size:11px}
.wk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #eee;font-size:14px}.wk:first-of-type{border-top:0}.wk b{display:block}.wk .wv{font-weight:800;white-space:nowrap}.wk .wv.ok{color:var(--ok)}.wk.no,.wk.no .wv{color:var(--mut);font-weight:400}.note{margin-top:10px;line-height:1.45}
.req{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid #eee;font-size:14px}
.st{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;background:#eee;height:fit-content;white-space:nowrap}
.st.new{background:#e0ecff;color:#1d4ed8}.st.work{background:#fff1c2;color:#8a6100}.st.done{background:#d9f5e3;color:var(--ok)}.st.rej{background:#fde0e4;color:var(--bad)}
.warn{background:#ffe3e6;border-radius:20px;margin:12px;padding:16px}
.warn .btn{background:var(--bad);color:#fff}
.off .btn:not(.keep),.off .btn:not(.keep):disabled{background:#d9d9de;color:#888;pointer-events:none}
.off .today{background:#eee}.off .gift{filter:grayscale(1)}.off .coin{filter:grayscale(1)}.off .bar>i,.off .bar>b.on{background:#bbb;border-color:#bbb}
.lang{display:flex;gap:2px;background:#ffffffcc;border-radius:20px;padding:3px}
.lang button{border:0;background:none;border-radius:16px;padding:6px 11px;font-weight:700;font-size:12px;font-family:inherit;color:var(--ink);cursor:pointer}
.lang button.on{background:var(--ink);color:#fff}
.login .lang{width:fit-content;margin:0 auto 14px}
.awg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin:14px 0 4px}
.aw{text-align:center;font-size:12px;line-height:1.25;color:var(--mut)}.aw.on{color:var(--ink)}
.aw .ai{position:relative;width:88%;margin:0 auto 6px}
.aw img{display:block;width:100%;height:auto;border-radius:50%;filter:grayscale(1);opacity:.3}.aw.on img{filter:none;opacity:1}
.awb{position:absolute;right:-6px;top:-4px;background:var(--y);color:var(--ink);font-weight:800;font-size:12px;border-radius:12px;padding:2px 8px;box-shadow:0 1px 4px #0003}
.awb.ok{background:var(--ok);color:#fff}.off .awb{background:#bbb;color:#555}
#ld{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,var(--ink),transparent) no-repeat;background-size:40% 100%;animation:ld 1s linear infinite}
#ld.on{opacity:1}
@keyframes ld{from{background-position:-40% 0}to{background-position:140% 0}}
@keyframes sp{to{transform:rotate(360deg)}}
.btn.load{position:relative;color:transparent;pointer-events:none}
.btn.load::after{content:'';position:absolute;inset:0;margin:auto;width:20px;height:20px;border:3px solid #0003;border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 8px)}
nav a{flex:1;text-align:center;font-size:11px;line-height:1.2;color:#444;text-decoration:none;cursor:pointer}
nav a span{display:block;font-size:22px;position:relative;width:fit-content;margin:0 auto}
nav .dot{position:absolute;top:0;right:-6px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid #fff}nav a.on{color:#d49a00;font-weight:700}
.login{max-width:360px;margin:12vh 16px 0;padding:24px;text-align:center;background:#ffffffd9;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:24px;box-shadow:0 4px 24px #0002}
@media(min-width:392px){.login{margin:12vh auto 0}}
.login h1{margin:14px 0 6px}
.login input{width:100%;font-size:32px;letter-spacing:10px;text-align:center;padding:12px;border:2px solid #ddd;border-radius:14px;margin:18px 0 0}
.login input:focus{outline:3px solid var(--y);border-color:var(--y)}
.err{color:var(--bad);margin-top:10px;min-height:20px}
.rules h2{margin:14px 0 6px}.rules li{margin:4px 0 4px 18px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:9}
.out{background:none;border:0;font-size:12px;color:var(--mut);margin:14px auto;display:block;text-decoration:underline;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(20,20,20,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-card{background:#fff;border-radius:16px;padding:22px;max-width:360px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.modal-card h2{margin:0 0 10px;font-size:18px}
.modal-card p{margin:0 0 18px;color:var(--mut);font-size:14px;line-height:1.5}
.modal-card .btn{margin:0}
.demo-banner{background:#fff6da;border:1px solid #f0d87a;border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.4;color:#7a5c00;margin:-34px 12px 12px;text-align:center;box-shadow:0 2px 10px #0001;position:relative;z-index:1}.demo-banner+.card{margin-top:0}
</style>

}

function loginView(err = '', val = '') {

  const go = () => { $('#go').classList.add('load'); start($('#pin').value.trim()); };
  $('#go').onclick = go; $('#pin').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#pin').focus(); bindLang();
}
async function start(pin, city, login) {
  if (!/^\d{5}$/.test(pin)) return loginView('pin5', pin);
  sess = { pin, city, login };
  try {
    const j = await call({ a: 'state' });
    if (j.chooseDemo) { demoCtx = { pin, cities: j.cities }; choose = null; idCtx = null; return chooseView(pin, j.cities, true); }
    if (j.choose) { choose = { pin, cities: j.choose }; idCtx = null; return chooseView(pin, j.choose); }
    if (j.needId) { idCtx = { pin, city }; return idView(pin, city); }
    choose = null; idCtx = null; demoCtx = j.demo ? { pin, cities: [city] } : null;
    sess.city = j.city; ls.set('sess', JSON.stringify(sess)); setState(j); render();
    if (j.demo) demoNotice(); else if (j.welcome) welcomeNotice(j.welcome);
  } catch (e) {
    if (e.message === 'ID не найден') return idView(pin, city, e.message);
    if (S && emsg(e) === 'eNet') return toast(t('eNet'));      // есть сохранённые данные — оставляем их на экране
    ls.del('sess'); ls.del('last'); S = null; idCtx = null; document.body.classList.remove('off'); app.className = ''; loginView(emsg(e), pin);
  }
}

function bar(o, tr) {
  const n = tr.length, pts = [0, ...tr.map(x => x[0])]; let f = 100;
  if (o < pts[n]) for (let i = 0; i < n; i++) if (o < pts[i + 1]) { f = (i + (o - pts[i]) / (pts[i + 1] - pts[i])) / n * 100; break; }
  return `<div class="bar"><i style="width:${f}%"></i>${tr.map((x, i) =>
    `<b class="${o >= x[0] ? 'on' : ''}" style="left:${(i + 1) / n * 100}%">${o >= x[0] ? '✓' : ''}<em>${x[1]}%</em><small>${x[0]} ${t('orders')}</small></b>`).join('')}</div>`;
}

  <section class="card"><div class="row"><div class="gift">🎁</div><div><h2>${t('bonusTitle')}</h2><span class="mut">${t('lastDay', { d: fmtDay(S.dataDate || td.d) })} · ${esc(S.cityName)}</span><div class="big">${td.o} <span>${t('forSum')} ${money(td.s)}</span></div></div></div>
  ${tiers.length ? bar(td.o, tiers) : ''}
  <div class="today"><span class="mut">${t('todayBonus')}</span><div class="big">${td.pct}% <span>${money(td.coins)}</span></div>
  <p class="mut">${next ? t('lastNext', { n: next[0] - td.o, p: next[1] }) : t('maxLevel')}</p></div>
  <p class="mut note">ℹ️ ${t('updNote')}</p></section>
  <section class="card"><h2>${t(S.closing ? 'weekPrev' : 'weekTitle')}</h2>
  ${(S.week || []).map(w => `<div class="wk ${w.has ? '' : 'no'}"><div><b>${esc(fmtWk(w.d))}</b><span class="mut">${w.has ? w.o + ' ' + t('orders') + ' · ' + money(w.s) : '—'}</span></div>
  <span class="wv ${w.done ? 'ok' : ''}">${!w.has ? '—' : w.done ? '✓ ' + w.coins : w.can ? '🪙 +' + w.coins : w.coins}</span></div>`).join('')}
  <button class="btn" id="claim" ${claim > 0 ? '' : 'disabled'}>🪙 ${t('claim')}${claim > 0 ? ' +' + claim : ''}</button>
  <p class="mut note">${S.gap ? t('gapNote') : S.closing ? t('closeLast', { t: `<b data-cd="${S.cycleEnd}">${dur(S.cycleEnd - Date.now())}</b>` }) : t('keepNote')}</p></section>

  <section class="card dark"><div class="row" style="justify-content:space-between"><div><h2>${t('yourCoins')}</h2><span class="mut">${t('coinsHint')}</span></div><div class="pill" style="background:none;color:var(--y);font-size:26px">${S.balance}</div></div>
  <div class="packs">${packs.map((p, i) => `<div class="pack"><b>${hrs(p[0])}</b><div class="cost"><span class="coin">฿</span>${p[1]}</div>
  <button class="btn sm" data-buy="${i}" ${S.balance >= p[1] ? '' : 'disabled'}>${t('exchange')}</button></div>`).join('')}</div></section>

  <section class="card"><h2>${t('wdTitle')}</h2>
  <p class="mut" style="margin-top:4px">${t('wdNote')} ${t('wdLeft')} <b data-cd="${(S.cycleEnd || S.nextMonday)}">${dur((S.cycleEnd || S.nextMonday) - Date.now())}</b></p></section>

  ${S.requests.length ? `<section class="card"><h2>${t('myReqs')}</h2>${S.requests.map(r => { const k = STK[r.st]; return `<div class="req"><div><b>${reqTitle(r)}</b><div class="mut">${esc(r.t)}</div></div><div style="text-align:right"><span class="st ${k || ''}">${k ? t('st_' + k) : esc(r.st)}</span><div class="mut">−${r.cost}</div></div></div>`; }).join('')}</section>` : ''}

  ${legal || S.demo ? '' : `<section class="warn"><h2>${t('pdlTitle')}</h2><p style="margin:6px 0 0">${t('pdlText')}</p><a href="${PDL_URL}"><button class="btn keep sm">${t('pdlBtn')}</button></a></section>`}
  <button class="out" id="out">${t('logout')}</button>`;
}

function awardsView() {
  const aw = S.awards || [], got = aw.filter(a => a.on).length, ac = S.awardClaim || 0, ak = S.awardCoins || 100;
  return `<header><div class="top"><img class="logo" src="maxim-logo.png" alt="maxim">${langSw()}</div><h1>${t('awTitle')}</h1></header>
  <section class="card"><p class="mut">${t('awHint', { n: ak })} · ${t('awCount', { a: got, b: aw.length })}</p>
  <div class="awg">${aw.map(a => `<div class="aw ${a.on ? 'on' : ''}"><div class="ai"><img src="awards/${a.k}.webp" width="240" height="240" alt="${esc(t('aw_' + a.k))}" loading="lazy">${a.on ? `<span class="awb ${a.done ? 'ok' : ''}">${a.done ? '✓' : '+' + ak}</span>` : ''}</div><span>${t('aw_' + a.k)}</span></div>`).join('')}</div>
  <button class="btn" id="awclaim" ${ac > 0 ? '' : 'disabled'}>🪙 ${t('awClaim')}${ac > 0 ? ' +' + ac : ''}</button></section>`;
}

function rulesView() {
  return `<header><div class="top"><img class="logo" src="maxim-logo.png" alt="maxim">${langSw()}</div><h1>${t('rulesTitle')}</h1></header>
  <section class="card rules"><h2>${t('r_bonus_h')}</h2><p>${t('r_bonus_p')}</p>
  <ul>${S.tiers.map(x => `<li>${t('r_tier', { n: x[0], p: x[1] })}</li>`).join('')}</ul>
  <h2>${t('r_coins_h')}</h2><ul><li>${t('r_c1')}</li><li>${t('r_c2')}</li><li>${t('r_c3')}</li><li>${t('r_aw', { n: S.awardCoins || 100 })}</li></ul>
  <h2>${t('r_spend_h')}</h2><ul>${S.packs.map(p => `<li>${t('r_pack', { h: hrs(p[0]), c: p[1] })}</li>`).join('')}<li>${t('r_wd')}</li></ul>
  <p style="margin-top:8px">${t('r_note')}</p>
  <h2>${t('r_cond_h')}</h2><ul><li>${t('r_cond')}</li></ul></section>`;
}

function render() {
  const grey = !S.legal || !!S.demo; app.className = grey ? 'off' : ''; document.body.classList.toggle('off', grey);   // !! — иначе undefined превращает toggle() в переключатель
  app.innerHTML = (tab === 'home' ? homeView() : tab === 'awards' ? awardsView() : rulesView()) + `<nav>
  <a data-t="home" class="${tab === 'home' ? 'on' : ''}"><span>🏠</span>${t('nHome')}</a>
  <a data-t="awards" class="${tab === 'awards' ? 'on' : ''}"><span>🏆${S.awardClaim > 0 ? '<i class="dot"></i>' : ''}</span>${t('nAwards')}</a>
  <a data-t="rules" class="${tab === 'rules' ? 'on' : ''}"><span>📋</span>${t('nRules')}</a>
  <a href="${TAXSEE_URL}"><span>↩️</span>${t('nBack')}</a></nav>`;
  app.querySelectorAll('[data-t]').forEach(a => a.onclick = () => { tab = a.dataset.t; render(); scrollTo(0, 0); });
  bindLang();
  const run = (body, ok, btn) => async () => {
    if (busy) return; busy = true; if (btn) btn.classList.add('load');
    try { setState(await call(body)); toast(t(ok)); } catch (e) { toast(errText(emsg(e))); }
    busy = false; render();
  };
  if ($('#claim')) $('#claim').onclick = run({ a: 'claim' }, 'okClaim', $('#claim'));
  if ($('#awclaim')) $('#awclaim').onclick = run({ a: 'claimAwards' }, 'okClaim', $('#awclaim'));
  app.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const p = S.packs[b.dataset.buy];
    if (confirm(t('confirmBuy', { c: p[1], h: hrs(p[0]) }))) run({ a: 'buy', i: +b.dataset.buy }, 'okBuy', b)();
  });
  if ($('#out')) $('#out').onclick = () => { ls.del('sess'); ls.del('last'); sess = S = null; document.body.classList.remove('off'); app.className = ''; loginView(); };
}

setInterval(() => {
  document.querySelectorAll('[data-cd]').forEach(e => { e.textContent = dur(+e.dataset.cd - Date.now()); });
  if (S && (S.nextClaimAt < Date.now() || (S.cycleEnd || S.nextMonday) < Date.now()) && !busy) refresh();
}, 30000);
async function refresh() { try { setState(await call({ a: 'state' })); render(); } catch (e) {} }

document.documentElement.lang = L; document.title = t('title') + ' — Maxim';
const saved = ls.get('sess');
if (saved) {
  try {
    const s = JSON.parse(saved), c = JSON.parse(ls.get('last') || 'null');
    sess = s;
    if (c && c.p === s.pin && c.c === s.city && Date.now() - c.t < 864e5) { S = c.s; render(); }
    start(s.pin, s.city, s.login);
  } catch (e) { loginView(); }
} else loginView();
</script>
</body>
</html>
